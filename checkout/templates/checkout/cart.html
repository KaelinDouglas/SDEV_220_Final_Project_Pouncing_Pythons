<!DOCTYPE html>
<html>
<head><title>Your Cart</title></head>
<body>
    <h1>Your Cart</h1>
    <form method="post">
        {% csrf_token %}
        {% for key, info in cart.items %}
            <p>
                {{ info.name }} — ${{ info.price }}
                Qty: <input type="number" name="qty_{{ key }}" value="{{ info.qty }}" min="0">
            </p>
        {% empty %}
            <p>Your cart is empty.</p>
        {% endfor %}
        <button type="submit">Update Cart</button>
    </form>

    <p><strong>Total: ${{ cart_total }}</strong></p>
    <p><a href="{% url 'menu' %}">← Back to menu</a></p>
    <p><a href="{% url 'checkout' %}">Checkout →</a></p>
</body>
</html>
